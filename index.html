html,body{margin:0;padding:0;max-width:100%;font-family:Helvetica,Arial,sans-serif;color:#151413;background:#fff}
body{overflow-x:hidden}
button,input,select{font:inherit}
a{color:inherit;text-decoration:none}
button{color:inherit}
button,a{-webkit-tap-highlight-color:transparent}
button:focus-visible,a:focus-visible{outline:2px solid #151413;outline-offset:4px}
[hidden]{display:none !important}
:root{color-scheme:light;--font-body--family:Helvetica,Arial,sans-serif;--font-body--weight:400;--font-heading--family:Helvetica,Arial,sans-serif;--font-heading--weight:400;--color-primary-button-background:#151413;--color-primary-button-text:#fff;--style-border-radius-buttons-primary:0px}

/* ================= site header ================= */
.site-header{height:88px;padding:0 40px;display:flex;align-items:center;gap:32px;border-bottom:1px solid #e4e4e4;background:#fff;position:relative;z-index:50}
.site-header .brand{margin-right:auto;display:inline-flex}
.site-header .brand img{display:block;width:68px;height:24px;object-fit:contain}
.site-header nav{display:flex;gap:28px;font-size:14px;font-weight:600;font-family:Inter,Helvetica,Arial,sans-serif}
.site-header nav a{padding:12px 0}
.site-header nav a:hover{text-decoration:underline;text-underline-offset:4px}
#open-bag{display:flex;align-items:center;justify-content:center;gap:5px;background:none;border:none;min-width:44px;min-height:44px;cursor:pointer}
#open-bag svg{display:block}
#open-bag[data-cart-count]{font-size:10px}

/* ================= runway section ================= */
runway-section{display:block;position:relative;color:var(--rw-text,#151413);background:var(--rw-panel,#fff);font-family:var(--font-body--family,Helvetica,Arial,sans-serif);font-weight:var(--font-body--weight,400);-webkit-font-smoothing:antialiased}
runway-section .rw__sr{position:absolute;width:1px;height:1px;clip:rect(0,0,0,0);overflow:hidden;white-space:nowrap}

.rw__sticky{height:var(--rw-frame-h,100svh);display:flex;flex-direction:column}
.rw__grid{display:grid;grid-template-columns:minmax(0,1fr) 380px;grid-template-rows:minmax(0,1fr);width:100%;max-width:none;margin:0 auto}
.rw__left{position:relative;display:flex;flex-direction:column;background:#fff;overflow:hidden}
.rw__panel.has-rule{background:#fff;border-left:1px solid #c8c8c8}
.rw__panel-inner{position:absolute;inset:0;display:flex;flex-direction:column}

/* head */
.rw__head{display:flex;justify-content:space-between;align-items:flex-end;gap:24px;padding:44px 56px 0;z-index:5}
.rw__intro{display:flex;flex-direction:column;gap:12px;max-width:640px}
.rw__title{margin:0;font-family:var(--rw-hf,Helvetica,Arial,sans-serif);font-weight:var(--rw-hw,400);font-size:46px;line-height:1;letter-spacing:-0.02em;color:#151413}
.rw__sub{font-size:12px;line-height:1.55;color:#66625c;max-width:46ch;margin:0}

/* stage */
.rw__stage{position:relative;flex:1 1 auto;min-height:0;touch-action:pan-y;user-select:none;cursor:grab;outline:none;overflow:hidden;z-index:0}
.rw__stage:focus-visible{box-shadow:inset 0 0 0 2px #0e0e0e}
.rw__stage.grabbing{cursor:grabbing}
.rw__actors{position:absolute;inset:0}
.rw__heroes{position:absolute;inset:0;pointer-events:none;z-index:1500}
.rw__sweep{position:absolute;inset:0;z-index:1550;mix-blend-mode:soft-light;pointer-events:none}
.rw__sweep::before{content:'';position:absolute;top:-20%;bottom:-20%;width:42%;left:0;background:linear-gradient(100deg,transparent,rgb(255 255 255/.25) 42%,rgb(255 255 255/.55) 50%,rgb(255 255 255/.25) 58%,transparent);transform:translateX(-130%) skewX(-12deg);opacity:0}
.rw__stage.is-sweep .rw__sweep::before{animation:rw-sweep 1.5s var(--rw-ease-silk,cubic-bezier(.65,0,.35,1))}
@keyframes rw-sweep{0%{transform:translateX(-130%) skewX(-12deg);opacity:0}18%{opacity:1}100%{transform:translateX(330%) skewX(-12deg);opacity:0}}
.rw__cursor{position:absolute;left:0;top:0;width:0;height:0;z-index:1700;pointer-events:none}
.rw__cursor-in{position:absolute;left:-42px;top:-42px;width:84px;height:84px;border-radius:50%;display:grid;place-items:center;color:#151413;border:1px solid color-mix(in srgb,#151413 28%,transparent);background:color-mix(in srgb,#fff 40%,transparent);backdrop-filter:blur(6px);opacity:0;scale:.3;transition:transform .6s var(--rw-ease,cubic-bezier(.16,1,.3,1)),opacity .35s,background .35s,border-color .35s,color .35s}
.rw__cursor-label{grid-area:1/1;font-size:10px;letter-spacing:.24em;padding-left:.24em;text-transform:uppercase;white-space:nowrap;opacity:0;transition:opacity .25s,letter-spacing .7s var(--rw-ease,cubic-bezier(.16,1,.3,1))}
.rw__cursor-drag{opacity:1}
.rw__cursor.is-on .rw__cursor-in{opacity:1;scale:1}
.rw__cursor.is-on .rw__cursor-drag{opacity:1}
.rw__cursor.is-view .rw__cursor-drag{opacity:0}
.rw__cursor.is-view .rw__cursor-view{opacity:1}
.rw__cursor.is-link .rw__cursor-in{scale:.2;background:var(--rw-accent,#0e0e0e);border-color:transparent}
.rw__cursor.is-link .rw__cursor-label{opacity:0}
.rw__cursor.is-drag .rw__cursor-in{scale:.74;background:var(--rw-accent,#0e0e0e);border-color:var(--rw-accent,#0e0e0e);color:var(--rw-on-accent,#fff)}
.rw__cursor.is-drag .rw__cursor-label{opacity:1;letter-spacing:.42em}

/* walk line (phone) */
.rw__walk{position:absolute;left:50%;bottom:8px;z-index:1600;width:min(140px,38%);transform:translateX(-50%);display:none}
.rw__walk-line{display:block;height:2px;border-radius:2px;background:color-mix(in srgb,#151413 14%,transparent);position:relative;overflow:hidden}
.rw__walk-line::after{content:'';position:absolute;inset:0;background:#0e0e0e;transform:scaleX(var(--rw-progress,0));transform-origin:left;transition:transform 1.1s var(--rw-ease,cubic-bezier(.16,1,.3,1))}

/* model bodies */
.rw__model{position:absolute;left:0;bottom:0;transform-origin:50% 100%;will-change:transform,opacity;opacity:0}
.rw__shadow{position:absolute;left:58%;bottom:0;width:150%;height:9%;min-height:14px;max-height:46px;transform:translate(-50%,50%);filter:blur(2px);background:radial-gradient(closest-side,rgb(20 16 12/.30),rgb(20 16 12/.14) 45%,rgb(20 16 12/.04) 75%,rgb(20 16 12/0))}
.rw__figure{position:relative;height:var(--rw-model-h,560px);aspect-ratio:var(--rw-ar,.5625)}
.rw__art{position:absolute;inset:0;transform:translateY(calc(var(--rw-foot,0)*100%))}
.rw__art img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;object-position:50% 100%;pointer-events:none;user-select:none;opacity:0}
.rw__art img.is-decoded{opacity:1}
.rw__hit{position:absolute;inset:0;z-index:1;background:transparent;border:none;border-radius:24px;cursor:pointer}
.rw__hit:focus-visible{outline:2px solid var(--rw-accent,#0e0e0e);outline-offset:6px}

/* hero */
.rw__hero{position:absolute;left:var(--rw-hx,72%);bottom:var(--rw-hy,30px);transform:translateX(-50%) scale(var(--rw-fs,1));transform-origin:50% 100%;opacity:0;visibility:hidden}
.rw__hero.is-on{opacity:1;visibility:visible}
.rw__hero.is-was{opacity:0}
.rw__morph{position:relative}
.rw__morph .rw__figure{position:relative}
.rw__zoom{position:absolute;inset:0;z-index:1;background:transparent;border:none;border-radius:24px;cursor:zoom-in}
.rw__pins{position:absolute;inset:0;pointer-events:none}
.rw__pin{position:absolute;width:44px;height:44px;margin:-22px 0 0 -22px;background:transparent;border:none;display:grid;place-items:center;pointer-events:auto;cursor:pointer}
.rw__pin-dot{width:24px;height:24px;border-radius:50%;background:rgb(255 255 255/.86);backdrop-filter:blur(6px);color:#151413;font-size:11px;font-weight:600;line-height:1;display:grid;place-items:center;box-shadow:0 4px 14px -4px rgb(0 0 0/.35);position:relative;transition:transform .5s cubic-bezier(.2,1.6,.4,1),background .25s,color .25s}
.rw__pin-dot::after{content:'';position:absolute;inset:-5px;border-radius:50%;border:1px solid rgb(255 255 255/.8);animation:rw-ring 2.6s cubic-bezier(.2,.6,.3,1) infinite}
.rw__pin-dot::before{content:'';position:absolute;inset:-5px;border-radius:50%;border:1px solid rgb(255 255 255/.55);animation:rw-ring 2.6s cubic-bezier(.2,.6,.3,1) infinite 1.3s}
@keyframes rw-ring{0%{scale:.8;opacity:.9}100%{scale:1.7;opacity:0}}
.rw__pin:hover .rw__pin-dot,.rw__pin.is-hot .rw__pin-dot{scale:1.3;background:#0e0e0e;color:#fff;box-shadow:0 0 0 6px color-mix(in srgb,#0e0e0e 22%,transparent),0 8px 20px -6px rgb(0 0 0/.45)}
.rw__pin:focus-visible .rw__pin-dot{box-shadow:0 0 0 2px #fff,0 0 0 4px #0e0e0e}
.rw__pin::after{content:attr(data-tip);position:absolute;left:calc(100% - 6px);top:50%;max-width:200px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:7px 12px;border-radius:999px;background:rgb(255 255 255/.88);backdrop-filter:blur(10px);color:#151413;font-size:11px;font-weight:500;letter-spacing:.04em;line-height:1;box-shadow:0 10px 26px -12px rgb(0 0 0/.4);opacity:0;transform:translate(-8px,-50%) scale(.96);transform-origin:left;transition:opacity .35s,transform .6s var(--rw-ease,cubic-bezier(.16,1,.3,1));pointer-events:none}
.rw__pin.is-hot::after,.rw__pin:focus-visible::after,.rw__pin:hover::after{opacity:1;transform:translate(0,-50%)}

/* controls */
.rw__controls{display:flex;align-items:center;gap:20px;padding:6px 44px 30px;z-index:5}
.rw__icon{width:44px;height:44px;display:grid;place-items:center;border:none;background:none;color:#151413;position:relative;cursor:pointer}
.rw__icon::before{content:'';position:absolute;inset:2px;border-radius:50%;border:1px solid currentColor;opacity:0;scale:.55;transition:transform .7s var(--rw-ease,cubic-bezier(.16,1,.3,1)),opacity .4s}
.rw__icon:hover::before{opacity:.22;scale:1}
.rw__icon svg{transition:transform .5s cubic-bezier(.2,1.6,.4,1)}
.rw__icon:active svg{scale:.88}
.rw__icon:focus-visible{outline:2px solid var(--rw-accent,#0e0e0e);outline-offset:2px;border-radius:4px}
.rw__icon[data-rw-prev]:hover svg{transform:translateX(-4px)}
.rw__icon[data-rw-next]:hover svg{transform:translateX(4px)}
.rw__ticks{display:flex;flex:1;gap:6px;min-width:0}
.rw__tick{flex:0 1 44px;min-width:14px;height:44px;display:flex;flex-direction:column;align-items:flex-start;justify-content:center;gap:9px;color:#66625c;background:none;border:none;cursor:pointer;transition:flex-basis .8s cubic-bezier(.2,1.25,.3,1),color .3s;text-align:left;min-height:0}
.rw__tick[aria-current="true"]{flex:0 0 190px;color:#151413}
.rw__tick:hover{color:#151413}
.rw__tick:hover .rw__tick-bar{scale:1.5}
.rw__tick-bar{display:block;width:100%;height:2px;overflow:hidden;background:color-mix(in srgb,#151413 14%,transparent);position:relative;transition:scale .5s var(--rw-ease,cubic-bezier(.16,1,.3,1))}
.rw__tick-bar::after{content:'';position:absolute;inset:0;background:#151413;transform:scaleX(0);transform-origin:left;transition:transform 1s var(--rw-ease,cubic-bezier(.16,1,.3,1)),opacity .4s,background .4s}
.rw__tick.is-past .rw__tick-bar::after{transform:scaleX(1);opacity:.35}
.rw__tick[aria-current="true"] .rw__tick-bar::after{transform:scaleX(1);background:#0e0e0e;opacity:1}
.rw__tick[aria-current="true"].is-run .rw__tick-bar::after{animation:rw-fill var(--rw-speed,5s) linear forwards}
@keyframes rw-fill{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.rw__tick-label{font-size:10px;letter-spacing:.12em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-variant-numeric:tabular-nums;display:flex;width:100%}
.rw__tick-name{display:none}
.rw__tick[aria-current="true"] .rw__tick-name{display:inline;animation:rw-name-in 1.1s var(--rw-ease,cubic-bezier(.16,1,.3,1)) .1s backwards}
@keyframes rw-name-in{from{opacity:0;letter-spacing:.34em}to{opacity:1;letter-spacing:normal}}

/* panel */
.rw__panel-head{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding:44px 32px 18px}
.rw__panel-title{margin:0;font-family:var(--rw-hf,Helvetica,Arial,sans-serif);font-weight:var(--rw-hw,400);font-size:18px;line-height:1.1}
.rw__label{font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:#66625c;white-space:nowrap}
.rw__label.is-swap{animation:rw-fade .8s var(--rw-ease,cubic-bezier(.16,1,.3,1))}
@keyframes rw-fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.rw__look-panel{display:flex;flex-direction:column;flex:1 1 auto;min-height:0}
.rw__mhead{display:none}
.rw__items{list-style:none;margin:0;padding:6px 32px 20px;display:flex;flex-direction:column;overflow-y:auto;flex:1 1 auto;min-height:0;overscroll-behavior:contain;scrollbar-width:thin}
.rw__item{position:relative;display:grid;grid-template-columns:var(--rw-thumb,92px) minmax(0,1fr) 44px;column-gap:18px;align-items:center;padding:18px 0}
.rw__item.has-dividers{border-top:1px solid #c8c8c8}
.rw__item.has-dividers:last-child{border-bottom:1px solid #c8c8c8}
.rw__item::after{content:'';position:absolute;bottom:-1px;left:0;right:0;height:1px;background:var(--rw-accent,#0e0e0e);transform:scaleX(0);transform-origin:left;transition:transform .9s var(--rw-ease,cubic-bezier(.16,1,.3,1))}
.rw__item.is-hot::after,.rw__item:hover::after{transform:scaleX(1)}
.rw__tag{position:absolute;top:calc(var(--rw-tag-top,18px) - 7px);left:calc(var(--rw-tag-left,0px) + 8px);z-index:2;display:flex;flex-direction:column;transform-origin:10px 0;pointer-events:none}
.rw__tag::before{content:'';width:1px;height:11px;background:color-mix(in srgb,#151413 50%,transparent);margin-left:10px}
.rw__tag-text{background:#151413;color:#fff;font-size:9px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;padding:4px 6px;border-radius:2px}
.rw__item:hover .rw__tag{animation:rw-swing 1.4s cubic-bezier(.3,.7,.4,1)}
@keyframes rw-swing{0%{transform:rotate(-16deg)}25%{transform:rotate(11deg)}45%{transform:rotate(-7deg)}65%{transform:rotate(4deg)}82%{transform:rotate(-2deg)}100%{transform:rotate(0)}}
.rw__media{display:block;aspect-ratio:4/5;border-radius:var(--rw-thumb-radius,0);overflow:hidden;background:color-mix(in srgb,#151413 5%,#fff);position:relative}
.rw__media img{width:100%;height:100%;object-fit:cover;display:block;transition:transform 1.4s var(--rw-ease,cubic-bezier(.16,1,.3,1))}
.rw__item:hover .rw__media img{transform:scale(1.07)}
.rw__num{position:absolute;top:6px;right:6px;width:20px;height:20px;border-radius:50%;background:rgb(255 255 255/.9);color:#151413;font-size:10px;font-weight:600;display:grid;place-items:center;transition:background .3s,color .3s,transform .45s cubic-bezier(.2,1.6,.4,1)}
.rw__item.is-hot .rw__num,.rw__item:hover .rw__num{background:#0e0e0e;color:#fff;transform:scale(1.12)}
.rw__info{display:flex;flex-direction:column;gap:5px;min-width:0}
.rw__type{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:#66625c;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rw__name{font-size:13px;font-weight:500;line-height:1.3;align-self:flex-start;background:linear-gradient(currentColor,currentColor) 0 100%/0 1px no-repeat;transition:background-size .7s var(--rw-ease,cubic-bezier(.16,1,.3,1))}
.rw__name:hover{background-size:100% 1px}
.rw__price{font-size:12px;display:flex;gap:8px}
.rw__add{width:44px;height:44px;display:grid;place-items:center;border:none;background:none;cursor:pointer;position:relative;align-self:end}
.rw__add svg{grid-area:1/1}
.rw__add .rw__add-check,.rw__add .rw__add-spin{opacity:0}
.rw__add svg{transition:transform .55s cubic-bezier(.2,1.6,.4,1),opacity .2s}
.rw__add::before{content:'';position:absolute;inset:4px;border-radius:var(--rw-add-radius,20px);border:1px solid currentColor;opacity:0;scale:.55;transition:transform .7s var(--rw-ease,cubic-bezier(.16,1,.3,1)),opacity .4s}
.rw__add:hover::before{opacity:.22;scale:1}
.rw__add.is-picking svg.rw__add-plus{transform:rotate(45deg)}
.rw__add.is-picking::before{opacity:.22}
.rw__add.is-loading .rw__add-plus{visibility:hidden}
.rw__add.is-loading .rw__add-spin{opacity:1;animation:rw-spin .8s linear infinite}
.rw__add.is-added .rw__add-plus{visibility:hidden}
.rw__add.is-added .rw__add-check{opacity:1;color:var(--rw-accent,#0e0e0e);animation:rw-pop .6s cubic-bezier(.2,1.6,.4,1)}
.rw__add.is-added .rw__add-check path{stroke-dasharray:24;stroke-dashoffset:24;animation:rw-draw .7s var(--rw-ease,cubic-bezier(.16,1,.3,1)) .1s forwards}
.rw__add.is-added::after{content:'';position:absolute;inset:4px;border-radius:20px;border:1px solid var(--rw-accent,#0e0e0e);animation:rw-burst 1s var(--rw-ease,cubic-bezier(.16,1,.3,1)) forwards}
@keyframes rw-spin{to{transform:rotate(360deg)}}
@keyframes rw-pop{0%{scale:.4}60%{scale:1.25}100%{scale:1}}
@keyframes rw-draw{to{stroke-dashoffset:0}}
@keyframes rw-burst{from{scale:.55;opacity:.9}to{scale:1.7;opacity:0}}
.rw__item.is-loading .rw__media::before{content:'';position:absolute;inset:0;z-index:1;background:linear-gradient(100deg,transparent 30%,rgb(255 255 255/.5) 50%,transparent 70%);transform:translateX(-100%);animation:rw-shimmer 1.1s linear infinite}
@keyframes rw-shimmer{to{transform:translateX(100%)}}

/* picker (inline) */
.rw__picker[data-rw-picker]{grid-column:1/-1;display:flex;flex-direction:column;gap:14px;padding-top:16px}
.rw__picker[hidden]{display:none}
.rw__picker.is-open{animation:rw-drop .7s var(--rw-ease,cubic-bezier(.16,1,.3,1))}
@keyframes rw-drop{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:none}}
.rw__picker-head{display:none}
.rw__opt{border:none;padding:0;margin:0}
.rw__opt-name{font-size:11px;color:#151413;margin-bottom:8px;display:block}
.rw__opt-values{display:flex;flex-wrap:wrap;gap:8px}
.rw__pill{position:relative;display:inline-flex}
.rw__pill input{position:absolute;inset:0;opacity:0;cursor:pointer;margin:0}
.rw__pill-label{display:inline-flex;align-items:center;justify-content:center;min-width:44px;min-height:40px;padding:0 14px;border-radius:30px;border:1px solid #c8c8c8;background:transparent;color:#151413;font-size:11px;transition:background .3s,color .3s,border .3s,transform .45s var(--rw-ease-spring,cubic-bezier(.34,1.56,.64,1)),box-shadow .45s}
.rw__pill:hover .rw__pill-label{border-color:#151413}
.rw__pill input:checked + .rw__pill-label{background:#151413;color:#fff;border-color:#151413}
.rw__pill input:active + .rw__pill-label{transform:scale(.94)}
.rw__pill input:focus-visible + .rw__pill-label{outline:2px solid var(--rw-accent,#0e0e0e);outline-offset:2px}
.rw__pill.is-unavailable{pointer-events:none}
.rw__pill.is-unavailable .rw__pill-label{color:#999;background:linear-gradient(135deg,transparent 45%,#999 45%,#999 55%,transparent 55%)}
.rw__confirm{min-height:46px;border:none;border-radius:var(--rw-btn-radius,0);background:var(--rw-btn-bg,#151413);color:var(--rw-btn-fg,#fff);font-size:11px;font-weight:500;letter-spacing:.02em;display:flex;align-items:center;justify-content:center;gap:10px;position:relative;overflow:hidden;cursor:pointer;transition:transform .4s cubic-bezier(.2,1.5,.4,1)}
.rw__confirm:hover{transform:translateY(-1px)}
.rw__confirm::before{content:'';position:absolute;top:0;bottom:0;width:60%;background:linear-gradient(100deg,transparent,rgb(255 255 255/.26) 50%,transparent);transform:translateX(-140%) skewX(-18deg)}
.rw__confirm:hover::before{animation:rw-shine 1.1s var(--rw-ease,cubic-bezier(.16,1,.3,1))}
@keyframes rw-shine{to{transform:translateX(260%) skewX(-18deg)}}
.rw__confirm:disabled{opacity:.45;cursor:default}
.rw__confirm:disabled:hover{transform:none}

/* bundle */
.rw__bundle.has-rule{padding:20px 32px 30px;display:flex;flex-direction:column;gap:16px;background:#fff;border-top:1px solid #c8c8c8}
.rw__msg{font-size:11px;line-height:1.45;color:var(--rw-accent,#0e0e0e);margin:0;display:none}
.rw__msg.is-on{display:block;animation:rw-rise .6s var(--rw-ease,cubic-bezier(.16,1,.3,1))}
.rw__bundle-row{display:flex;justify-content:space-between;align-items:flex-end;gap:12px}
.rw__bundle-copy{display:flex;flex-direction:column;gap:3px}
.rw__bundle-title{font-size:13px;font-weight:500}
.rw__bundle-note{font-size:11px;color:#66625c}
.rw__bundle-price{display:flex;align-items:baseline;gap:10px;white-space:nowrap}
.rw__bundle-price s{font-size:11px;color:#66625c}
.rw__bundle-price strong{font-family:var(--rw-hf,Helvetica,Arial,sans-serif);font-weight:400;font-size:16px}

const LOOKS = [

class RunwaySection extends HTMLElement {
  constructor() {

  connectedCallback() {

    const io = new IntersectionObserver((en) => {
      this.visible = en[0].isIntersecting;
      if (this.visible) this.kick();
      else this.stopLoop();
    }, { threshold: 0 });
    io.observe(this);
    this._io = io;

    const reveal = new IntersectionObserver((en) => {
      if (en[0].isIntersecting) {
        reveal.disconnect();
        if (this.reduceMotion) { this.classList.add('is-revealed'); }
        else requestAnimationFrame(() => requestAnimationFrame(() => this.classList.add('is-revealed')));
        this.cur = this.reduceMotion ? 0 : -1.15;
        this.target = 0;
        this.kick();
      }
    }, { threshold: 0, rootMargin: '0px 0px -22% 0px' });
    reveal.observe(this);
    this._reveal = reveal;

    if (!this.reduceMotion && this.dataset.autoplay === 'true') this.play(true);
  }

  /* ---------- markup builders ---------- */
  imgMarkup(look, lazy) {

  buildBodies() {
    const frag = document.createDocumentFragment();

      frag.appendChild(div);

    this.bodies = this.actors.querySelectorAll('.rw__model');

  }

  buildTicks() {
    const frag = document.createDocumentFragment();

      const b = document.createElement('button');
      b.className = 'rw__tick';
      b.dataset.rwTick = i;
      if (i === 0) b.setAttribute('aria-current', 'true');

  buildPanels() {

      const panel = document.createElement('div');
      panel.className = 'rw__look-panel';
      panel.dataset.rwPanel = i;

          <div class="rw__picker" data-rw-picker id="${PICKER_PREFIX}${look.key}-${n}" hidden>
            <div class="rw__picker-head">
              <img src="${item.image}" width="160" height="${item.id === 'tshirt' ? 225 : item.id === 'sweatshirt' ? 232 : item.id === 'sweatshirt-plus' ? 244 : item.id === 'hoodie' ? 222 : item.id === 'hoodie-black' ? 214 : 160}" alt="">

  buildCursorPoint() {

  /* ---------- feet detection ---------- */
  feetDetect() {
    const canvas = document.createElement('canvas');
    canvas.width = 48;
    canvas.height = 85;
    const ctx = canvas.getContext('2d', { willReadFrequently: true });
    LOOKS.forEach((look, i) => {
      const img = new Image();
      img.crossOrigin = 'anonymous';
      img.src = ASSET + look.model;
      img.onload = () => {
        try {
          ctx.clearRect(0, 0, 48, 85);
          ctx.drawImage(img, 0, 0, 48, 85);
          const data = ctx.getImageData(0, 0, 48, 85).data;
          let lastRow = -1;
          for (let y = 84; y >= 0; y--) {
            let has = false;
            for (let x = 0; x < 48; x++) {
              const a = data[(y * 48 + x) * 4 + 3];
              if (a > 40) { has = true; break; }
            }
            if (has) { lastRow = y; break; }
          }
          const foot = lastRow < 0 ? 0 : Math.min(Math.max((85 - 1 - lastRow) / 85, 0), 0.4);
          const val = foot.toFixed(4);
          this.bodies.forEach((b) => {
            if (+b.dataset.index % N === i) b.querySelector('.rw__art').style.setProperty('--rw-foot', val);
          });
          if (this.heros[i]) this.heros[i].querySelector('.rw__art').style.setProperty('--rw-foot', val);
        } catch (e) { /* tainted: keep 0 */ }
      };
    });
  }
  /* ---------- measurement ---------- */
  measure() {
    const W = this.stage.clientWidth;
    const H = this.stage.clientHeight;
    const isPhone = matchMedia('(max-width:749px)').matches;
    this.isPhone = isPhone;
    const header = document.querySelector('.site-header');
    const headerH = header ? header.offsetHeight : 88;
    let frameH;
    if (isPhone) {
      frameH = Math.round(window.innerHeight * (Number(this.dataset.mheightVh || 109) / 100));
    } else {
      frameH = Math.max(380, window.innerHeight - headerH);
    }
    this.style.setProperty('--rw-frame-h', frameH + 'px');
    if (this.isPhone !== this._prevPhone) this.remode();
    this._prevPhone = this.isPhone;

    this.W = this.stage.clientWidth;
    this.H = this.stage.clientHeight;
    this.fs = (!isPhone && this.dataset.style === 'ring') ? 1.08 : 1;
    this.style.setProperty('--rw-fs', this.fs);
    let modelH;
    if (!isPhone) {
      modelH = Math.max(200, Math.round((this.H - 34 - 18) / 1.08));
    } else {
      modelH = Math.max(200, Math.round(this.H - 24 - 18));
    }
    this.style.setProperty('--rw-model-h', modelH + 'px');
    this.modelH = modelH;
    this.unit = 0;
    for (const b of this.bodies) { this.unit = Math.max(this.unit, b.offsetWidth); }
    if (!this.unit) this.unit = Math.round(modelH * 0.5625);

    if (!isPhone) {
      this.hx = 0.5 * this.W;
      this.hy = 34;
      this.style.setProperty('--rw-hx', this.hx + 'px');
      this.style.setProperty('--rw-hy', this.hy + 'px');
      this.style.setProperty('--rw-ax', Math.round((this.hx / this.W) * 100) + '%');
    } else {
      this.hx = 0.3 * this.W;
      this.hy = 22;
      this.style.setProperty('--rw-hx', this.hx + 'px');
      this.style.setProperty('--rw-hy', this.hy + 'px');
      this.style.setProperty('--rw-ax', '30%');
    }
  }

  remode() {
    // dock any open sheet back into its card
    if (this.sheetOpen) this.dockSheet();
    this.kick();
  }

  /* ---------- placement primitive ---------- */
  put(el, x, bottom, scale, opacity, blur, z) {
    const w = this.unit;
    if (x + (w * scale) / 2 < -4 || x - (w * scale) / 2 > this.W + 4) opacity = 0;
    el.style.transform = `translate3d(${x}px, ${-bottom}px, 0) translateX(-50%) scale(${scale})`;
    el.style.opacity = opacity.toFixed(3);
    el.style.zIndex = z;
    el.style.visibility = opacity < 0.01 ? 'hidden' : 'visible';
    el.style.pointerEvents = opacity < 0.5 ? 'none' : 'auto';
    const b = Math.round(blur * 10) / 10;
    if (b > 0.05) el.style.filter = `blur(${b}px)`;
    else el.style.removeProperty('filter');
  }

  /* ---------- ring render ---------- */
  renderRing() {
    const W = this.W, H = this.H;
    const R = 0.62 * W, P = 1.65 * W;
    const floor = H - 34, horizon = 0.36 * H;
    const step = (2 * Math.PI) / BODIES;
    const cx = 0.5 * W;
    for (let a = 0; a < BODIES; a++) {
      const body = this.bodies[a];
      let phi = (((a - this.cur) * step) % (2 * Math.PI));
      if (phi > Math.PI) phi -= 2 * Math.PI;
      else if (phi < -Math.PI) phi += 2 * Math.PI;
      const z = R * (1 - Math.cos(phi));
      const persp = P / (P + z);
      const sl = Math.abs(phi) / step;
      let scale = persp * (1 + (this.fs - 1) * Math.max(0, Math.min(1, 1 - sl)));
      const x = cx + R * Math.sin(phi) * persp;
      const feet = horizon + (floor - horizon) * persp;
      const bottom = H - feet;
      let blur = sl <= 1 ? 1.8 * sl : Math.min(1.8 + (sl - 1) * 2, 6.5);
      let opacity = Math.max(0, Math.min(1, (Math.cos(phi) + 0.55) / 0.3));
      if (this.still && sl < 0.02) opacity = 0;
      const zidx = Math.round(scale * 1000);
      this.put(body, x, bottom, scale, opacity, blur, zidx);
    }
  }

  /* ---------- classic render ---------- */
  renderClassic() {
    const W = this.W, H = this.H;
    const ax = 0.3, ay = 22, sx = 0.32, sy = 22, sr = 0.76, ex = 0.55, d = 4;
    if (!this._goals) { this._goals = new Array(BODIES).fill(0); this._xs = new Array(BODIES).fill(0); this._vel = new Array(BODIES).fill(0); }
    for (let a = 0; a < BODIES; a++) {
      const body = this.bodies[a];
      const goal = wrapN(a - this.target);
      const prevGoal = this._goals[a];
      const trip = Math.abs(goal - prevGoal) > BODIES / 2;
      const from = this._xs[a];
      const tau = this.dragging ? 0.016 : trip ? 0.1 : 0.03 + 0.04 * Math.min(goal, 4);
      this._goals[a] += (goal - this._goals[a]) * (1 - Math.exp(-this.dt / tau));
      const K = 95, C = 19.49;
      const hv = this.dt / 3;
      for (let s = 0; s < 3; s++) {
        const acc = -K * (this._xs[a] - this._goals[a]) - C * this._vel[a];
        this._vel[a] += acc * hv;
        this._xs[a] += this._vel[a] * hv;
      }
      let x = this._xs[a];
      let k = x, e = -1;
      if (trip) {
        const u = Math.min(1, Math.abs(x - from) / Math.max(0.001, Math.abs(goal - from)));
        if (goal > from) {
          if (u < 0.5) e = 2 * u * 1.4;
          else k = goal + 2 * (1 - u);
        } else {
          if (u < 0.5) k = from + 2 * u;
          else e = 2 * (1 - u) * 1.4;
        }
      } else if (k < 0) e = Math.min(-k, 1.4);
      if (e >= 0) {
        this.put(body, W * (ax - ex * e), ay - 22 * e, 1 + 0.14 * e, Math.max(0, 1 - 1.05 * e), 4 * Math.min(e, 1), 1100);
      } else {
        const sc = Math.pow(sr, k);
        let op = k <= d - 1 ? Math.max(0, 1 - 0.13 * k) : Math.max(0, 0.61 * (4 - k));
        if (this.still && k < 0.02) op = 0;
        this.put(body, W * (ax + sx * k), ay + sy * k, sc, op, Math.min(0.9 * k, 3.2), 1000 - Math.round(10 * k));
      }
    }
  }

  /* ---------- render all ---------- */
  renderAll() {
    if (this.isPhone) this.renderClassic();
    else this.renderRing();
  }

  /* ---------- hero visibility ---------- */
  setStill(s) {
    this.still = s;
    if (s) {
      this.classList.add('rw--still');
      for (const h of this.heros) {
        const on = h.dataset.index == this.index;
        if (on) { h.classList.add('is-on'); h.style.opacity = '1'; h.style.visibility = 'visible'; }
        else { h.classList.remove('is-on'); h.style.opacity = '0'; h.style.visibility = 'hidden'; }
      }
      this.renderAll();
    } else {
      this.classList.remove('rw--still');
      for (const h of this.heros) {
        h.style.opacity = '0';
        h.style.visibility = 'hidden';
      }
    }
  }

  /* ---------- loop ---------- */
  kick() {
    cancelAnimationFrame(this.raf);
    this.loop(performance.now());
  }

  stopLoop() { cancelAnimationFrame(this.raf); }

  loop(now) {
    this.raf = requestAnimationFrame((t) => this.loop(t));
    let dt = (now - this.lastFrame) / 1000;
    this.lastFrame = now;
    if (!this.lastFrame) dt = 1 / 60;
    dt = Math.max(0.0001, Math.min(0.034, dt || 1 / 60));
    this.dt = dt;
    const K = 95, C = 19.49;
    const h = dt / 3;
    for (let s = 0; s < 3; s++) {
      const acc = -K * (this.cur - this.target) - C * this.vel;
      this.vel += acc * h;
      this.cur += this.vel * h;
    }
    if (Math.abs(this.cur - this.target) <= 0.0005 && Math.abs(this.vel) <= 0.0005) {
      this.cur = this.target;
      this.vel = 0;
      if (!this.still) {
        this.setStill(true);
        this.renderAll();
      }
    } else {
      if (this.still) this.setStill(false);
      this.renderAll();
    }
    if (this.dragging) this.renderAll();
  }
  /* ---------- index change ---------- */
  setIndex(i, silent) {
    this.index = i;
    this.style.setProperty('--rw-progress', ((i + 1) / N).toFixed(3));
    // tick state
    this.ticks.forEach((t, j) => {
      if (j === i) t.setAttribute('aria-current', 'true');
      else t.removeAttribute('aria-current');
      t.classList.toggle('is-past', j < i);
    });
    // heroes
    this.heros.forEach((h, j) => {
      const on = j === i;
      h.classList.toggle('is-on', on);
      h.classList.toggle('is-was', !on);
      h.setAttribute('aria-hidden', on ? 'false' : 'true');
      const zoom = h.querySelector('[data-rw-zoom]');
      if (zoom) zoom.tabIndex = on ? 0 : -1;
    });
    // panels
    this.panels.forEach((p, j) => {
      p.hidden = j !== i;
      p.classList.remove('is-in');
    });
    const active = this.panels[i];
    void active.offsetWidth;
    active.classList.add('is-in');
    // pieces label
    const text = active.querySelector('template[data-rw-pieces-text]').content.textContent.trim();
    this.pieces.textContent = text;
    this.pieces.classList.remove('is-swap');
    void this.pieces.offsetWidth;
    this.pieces.classList.add('is-swap');
    // live region
    if (!silent) {
      this.live.textContent = `Look ${i + 1}: ${LOOKS[i].name}`;
      this.stage.classList.remove('is-sweep');
      void this.stage.offsetWidth;
      this.stage.classList.add('is-sweep');
    }
    // clear hot
    this.clearHot();
    this.restartAutoplay();
    if (this.zoomed) this.closePopup();
    if (this.sheetOpen) this.dockSheet();
  }

  clearHot() {
    this.querySelectorAll('.rw__pin.is-hot').forEach((p) => p.classList.remove('is-hot'));
    this.querySelectorAll('.rw__item.is-hot').forEach((r) => r.classList.remove('is-hot'));
  }

  /* ---------- navigation ---------- */
  moveTo(T) {
    this.target = T;
    this.setStill(false);
    this.setIndex((T % N + N) % N);
    this.kick();
  }
  next() { this.moveTo(Math.round(this.target) + 1); }
  prev() { this.moveTo(Math.round(this.target) - 1); }
  go(i) {
    let d = (i - this.index) % N;
    if (d > 3) d -= N;
    this.moveTo(Math.round(this.target) + d);
  }

  /* ---------- autoplay ---------- */
  play(on) {
    this.playing = on;
    const btn = this.querySelector('[data-rw-auto]');
    if (btn) {
      btn.setAttribute('aria-pressed', on ? 'true' : 'false');
      const playIcon = btn.querySelector('[data-icon="play"]');
      const pauseIcon = btn.querySelector('[data-icon="pause"]');
      if (playIcon) playIcon.hidden = on;
      if (pauseIcon) pauseIcon.hidden = !on;
    }
    this.classList.toggle('is-playing', on);
    this.restartAutoplay();
  }

  restartAutoplay() {
    clearTimeout(this.timer);
    this.ticks.forEach((t) => t.classList.remove('is-run'));
    if (this.playing && this.visible) {
      void this.ticks[this.index].offsetWidth;
      this.ticks[this.index].classList.add('is-run');
      this.timer = setTimeout(() => {
        if (this.playing && this.visible && !this.dragging && !document.hidden && !this.panelHover && !this.zoomed && !this.engaged) {
          this.next();
        } else {
          this.restartAutoplay();
        }
      }, Number(this.dataset.speed || 5000));
    }
  }

  /* ---------- hot linking ---------- */
  hot(n, scroll) {
    this.clearHot();
    const scope = this.zoomed ? this.lb : this.heros[this.index];
    const pin = scope.querySelector(`[data-rw-pin="${n}"]`);
    if (pin) pin.classList.add('is-hot');
    const panel = this.panels[this.index];
    const card = panel.querySelector(`[data-rw-card="${n}"]`);
    if (card) {
      card.classList.add('is-hot');
      if (scroll) this.revealCard(card);
    }
  }

  revealCard(card) {
    const list = card.closest('.rw__items');
    const smooth = this.reduceMotion ? 'auto' : 'smooth';
    if (getComputedStyle(list).flexDirection === 'row') {
      list.scrollTo({ left: card.offsetLeft - list.offsetLeft - 20, behavior: smooth });
    } else if (list.scrollHeight > list.clientHeight) {
      list.scrollTo({ top: card.offsetTop - list.offsetTop - 12, behavior: smooth });
    } else {
      const r = card.getBoundingClientRect();
      if (r.top < 0 || r.bottom > window.innerHeight - 140) {
        window.scrollTo({ top: window.scrollY + r.top - 0.3 * window.innerHeight, behavior: smooth });
      }
    }
  }

  /* ---------- engage ---------- */
  engage() {
    if (!this.engaged) {
      this.engaged = true;
      this.play(false);
    }
  }
  /* ---------- bag ---------- */
  loadBag() {
    try {
      const raw = JSON.parse(localStorage.getItem('runway-styling-bag-v3') || '[]');
      if (!Array.isArray(raw)) return [];
      return raw
        .filter((e) => e && Number.isInteger(e.id) && Number.isInteger(e.quantity) && e.quantity >= 1 && e.quantity <= 20)
        .slice(0, 50);
    } catch (e) { return []; }
  }
  saveBag() {
    try { localStorage.setItem('runway-styling-bag-v3', JSON.stringify(this.bag)); } catch (e) {}
  }
  bagCount() {
    return this.bag.reduce((s, e) => s + e.quantity, 0);
  }
  renderBag() {
    document.querySelectorAll('[data-cart-count]').forEach((el) => { el.textContent = this.bagCount(); });
    const items = document.getElementById('bag-items');
    const total = document.getElementById('bag-total');
    if (!this.bag.length) {
      items.innerHTML = '<p class="bag-note">Your styling bag is empty. Choose a size beside a piece to save it.</p>';
      total.textContent = '';
      document.getElementById('export-bag').disabled = true;
      return;
    }
    let rows = '';
    let sum = 0;
    for (const e of this.bag) {
      const item = CATALOG.items.find((i) => i.variants.some((v) => v.id === e.id));
      if (!item) continue;
      const v = item.variants.find((v) => v.id === e.id);
      const size = v ? v.o[0] : '';
      const lineTotal = item.price * e.quantity;
      sum += lineTotal;
      let url = item.url;
      if (url && new URL(url).hostname !== 'nike-makknzjs.myshopify.com') throw new Error('bad url');
      rows += `
        <div class="bag-row">
          <img src="${item.image}" alt="${item.name}">
          <div>
            <h3>${item.name}</h3>
            <p>Size ${size} · Quantity ${e.quantity} · ${fmtUSD(lineTotal)}</p>
            <a href="${url}" target="_blank" rel="noopener noreferrer">View original piece ↗</a>
          </div>
          <button class="bag-remove" data-bag-remove="${e.id}" aria-label="Remove ${item.name}">×</button>
        </div>`;
    }
    items.innerHTML = rows;
    total.textContent = sum > 0 ? `Reference subtotal ${fmtUSD(sum)}` : '';
    document.getElementById('export-bag').disabled = false;
    items.querySelectorAll('[data-bag-remove]').forEach((b) => {
      b.addEventListener('click', () => {
        this.bag = this.bag.filter((e) => e.id !== Number(b.dataset.bagRemove));
        this.saveBag();
        this.renderBag();
      });
    });
  }
  addBag(entries) {
    for (const e of entries) {
      const ok = CATALOG.items.some((i) => i.variants.some((v) => v.id === e.id && v.a));
      if (!ok) throw new Error('Please choose an available size.');
    }
    for (const e of entries) {
      const found = this.bag.find((x) => x.id === e.id);
      if (found) found.quantity = Math.min(20, found.quantity + e.quantity);
      else this.bag.push({ id: e.id, quantity: e.quantity });
    }
    this.saveBag();
    this.renderBag();
    const single = entries.length === 1;
    this.toast(single ? 'Piece saved to your styling bag' : 'Look saved to your styling bag');
  }
  toast(msg) {
    const el = document.getElementById('bag-status');
    el.textContent = msg;
    el.classList.add('is-on');
    clearTimeout(this._toastTimer);
    this._toastTimer = setTimeout(() => el.classList.remove('is-on'), 2500);
  }

  /* ---------- picker ---------- */
  openPicker(card) {
    const picker = card.querySelector('[data-rw-picker]');
    if (!picker) return;
    const sheet = this.isPhone && !this.zoomed;
    if (this.isPhone) {
      if (this.sheetOpen) this.dockSheet();
      this.attachSheet(picker, card);
      return;
    }
    picker.hidden = false;
    card.classList.add('is-picking');
    card.querySelector('[data-rw-add]').setAttribute('aria-expanded', 'true');
    void picker.offsetWidth;
    picker.classList.add('is-open');
    this.revealCard(card);
    const checked = picker.querySelector('input:checked');
    if (checked) { try { checked.focus({ preventScroll: true }); } catch (e) {} }
    this.updatePickerState(card);
  }
  closePicker(card) {
    const picker = card.querySelector('[data-rw-picker]');
    if (!picker) return;
    picker.classList.remove('is-open');
    picker.hidden = true;
    card.classList.remove('is-picking');
    const add = card.querySelector('[data-rw-add]');
    if (add) add.removeAttribute('aria-expanded');
  }
  attachSheet(picker, card) {
    let host = document.querySelector('.rw-sheet-host');
    if (!host) {
      host = document.createElement('div');
      host.className = 'rw-sheet-host';
      host.innerHTML = `<button class="rw__pick-scrim" data-rw-pick-close tabindex="-1" aria-hidden="true"></button>`;
      document.body.appendChild(host);
    }
    this._sheetCard = card;
    host.appendChild(picker);
    // copy theme vars
    const src = getComputedStyle(this);
    ['--rw-panel','--rw-text','--rw-muted','--rw-line','--rw-accent','--rw-on-accent','--rw-btn-bg','--rw-btn-fg','--rw-btn-radius','--rw-pill-radius','--rw-bar-r','--rw-thumb-radius','--rw-pt-size','--rw-price','--rw-opt','--rw-ease','--rw-ease-sheet','--rw-ease-spring'].forEach((v) => {
      host.style.setProperty(v, src.getPropertyValue(v));
    });
    host.style.fontFamily = src.fontFamily;
    host.style.color = src.color;
    picker.hidden = false;
    card.classList.add('is-picking');
    card.querySelector('[data-rw-add]').setAttribute('aria-expanded', 'true');
    this.sheetOpen = true;
    this.classList.add('rw--picking');
    requestAnimationFrame(() => host.classList.add('is-open'));
    this.updatePickerState(card);
  }
  dockSheet() {
    const host = document.querySelector('.rw-sheet-host');
    if (!host) return;
    const picker = host.querySelector('[data-rw-picker]');
    if (picker) {
      const card = this._sheetCard || this.querySelector(`[data-rw-card="${picker.closest('.rw__item') ? picker.closest('.rw__item').dataset.rwCard : '1'}"]`);
      if (card) {
        picker.hidden = true;
        card.appendChild(picker);
        card.classList.remove('is-picking');
        const add = card.querySelector('[data-rw-add]');
        if (add) add.removeAttribute('aria-expanded');
      }
    }
    host.classList.remove('is-open');
    host.remove();
    this.sheetOpen = false;
    this._sheetCard = null;
    this.classList.remove('rw--picking');
  }

  updatePickerState(card) {
    const picker = card.querySelector('[data-rw-picker]');
    if (!picker) return;
    const item = ITEM_BY_ID[card.dataset.title];
    let variants;
    try { variants = JSON.parse(picker.querySelector('[data-rw-variants]').textContent); } catch (e) { variants = item.variants; }
    const inputs = picker.querySelectorAll('input[data-rw-option]');
    const selected = {};
    inputs.forEach((inp) => { if (inp.checked) selected[inp.name] = inp.value; });
    const selVals = Object.values(selected);
    // availability per option
    inputs.forEach((inp) => {
      const others = Object.entries(selected).filter(([k]) => k !== inp.name).map(([, v]) => v);
      const avail = variants.some((v) => v.a && v.o[0] === inp.value && others.every((o) => v.o.includes(o)));
      inp.closest('.rw__pill').classList.toggle('is-unavailable', !avail);
    });
    const match = variants.find((v) => v.a && selVals.every((s) => v.o.includes(s)) && v.o.length === selVals.length);
    const confirm = picker.querySelector('[data-rw-confirm]');
    const label = picker.querySelector('[data-rw-confirm-label]');
    if (!match) {
      confirm.disabled = true;
      label.textContent = this.dataset.msgSoldout || 'Sold out';
      card.removeAttribute('data-selected');
    } else {
      confirm.disabled = false;
      label.textContent = label.dataset.add || 'Add to bag';
      card.dataset.selected = match.id;
    }
  }

  addSingle(card) {
    const vid = card.dataset.selected;
    if (!vid) return;
    card.classList.add('is-loading');
    setTimeout(() => {
      try {
        this.addBag([{ id: Number(vid), quantity: 1 }]);
        card.classList.remove('is-loading');
        card.classList.add('is-added');
        card.querySelector('[data-rw-add]').setAttribute('aria-label', card.querySelector('[data-rw-add]').dataset.addedLabel);
        card.querySelector('[data-rw-add]').removeAttribute('aria-expanded');
        this.closePicker(card);
        if (this.isPhone && navigator.vibrate) { try { navigator.vibrate(12); } catch (e) {} }
      } catch (e) {
        card.classList.remove('is-loading');
        this.showMsg(card, this.dataset.msgError || 'Couldn’t add to bag. Please try again.');
      }
    }, 600);
  }

  showMsg(card, text) {
    const msg = card.closest('.rw__look-panel').querySelector('[data-rw-msg]');
    msg.textContent = text;
    msg.classList.remove('is-on');
    void msg.offsetWidth;
    msg.classList.add('is-on');
  }

  /* ---------- bundle CTA ---------- */
  addFullLook() {
    const panel = this.panels[this.index];
    if (panel.classList.contains('is-complete') || this.cta.classList.contains('is-loading')) return;
    const cards = [...panel.querySelectorAll('.rw__item')].filter((c) => !c.classList.contains('is-added') && !c.classList.contains('is-soldout'));
    this.bundleMsg.classList.remove('is-on');
    this.bundleMsg.textContent = '';
    const ready = cards.filter((c) => c.dataset.selected);
    const pending = cards.filter((c) => !c.dataset.selected);
    if (pending.length) {
      const names = pending.map((c) => c.dataset.title).join(', ');
      this.bundleMsg.textContent = this.dataset.msgChoose.replace('[items]', names);
      this.bundleMsg.classList.add('is-on');
      pending.forEach((c, i) => {
        if (i === 0 || !this.isPhone) this.openPicker(c);
      });
      this.revealCard(pending[0]);
      return;
    }
    if (!ready.length) return;
    this.cta.classList.add('is-loading');
    ready.forEach((c) => c.classList.add('is-loading'));
    setTimeout(() => {
      try {
        this.addBag(ready.map((c) => ({ id: Number(c.dataset.selected), quantity: 1 })));
        ready.forEach((c) => {
          c.classList.remove('is-loading');
          c.classList.add('is-added');
          c.querySelector('[data-rw-add]').setAttribute('aria-label', c.querySelector('[data-rw-add]').dataset.addedLabel);
        });
        this.cta.classList.remove('is-loading');
        if (cards.length <= 1) { /* nothing */ }
        if (this.panels[this.index].querySelectorAll('.rw__item:not(.is-added)').length <= 1) {
          panel.classList.add('is-complete');
        }
      } catch (e) {
        this.cta.classList.remove('is-loading');
        ready.forEach((c) => c.classList.remove('is-loading'));
        this.bundleMsg.textContent = this.dataset.msgError || 'Couldn’t add to bag. Please try again.';
        this.bundleMsg.classList.add('is-on');
      }
    }, 600);
  }
  /* ---------- popup ---------- */
  openPopup() {
    this.engage();
    this.clearHot();
    const hero = this.heros[this.index];
    const morph = hero.querySelector('.rw__morph');
    const fig = morph.querySelector('.rw__figure');
    const a = fig.getBoundingClientRect();
    const clone = morph.cloneNode(true);
    const zoom = clone.querySelector('[data-rw-zoom]');
    if (zoom) zoom.remove();
    clone.classList.add('rw__lb-model');
    clone.querySelectorAll('.rw__pin').forEach((p, i) => {
      p.tabIndex = 0;
      p.classList.remove('is-hot');
    });
    clone.querySelectorAll('.rw__art').forEach((art) => {
      art.style.setProperty('--rw-foot', hero.querySelector('.rw__art').style.getPropertyValue('--rw-foot') || '0');
      const img = art.querySelector('img');
      if (img) {
        img.loading = 'eager';
        img.decoding = 'async';
        const h = Math.max(160, Math.min(this.lbStage.clientHeight, this.lbStage.clientWidth / 0.5625));
        img.sizes = `${Math.round(h * 0.5625)}px`;
      }
    });
    const h = Math.max(160, Math.min(this.lbStage.clientHeight, this.lbStage.clientWidth / 0.5625));
    clone.style.setProperty('--rw-model-h', h + 'px');
    this.lbStage.innerHTML = '';
    this.lbStage.appendChild(clone);
    this.lbKicker.textContent = `${this.lb.dataset.word} ${String(this.index + 1).padStart(2, '0')}`;
    this.lbName.textContent = LOOKS[this.index].name;

    this.classList.add('rw--zoom');
    this.lb.setAttribute('aria-hidden', 'false');
    this.zoomed = true;

    if (this.reduceMotion) return;
    const b = clone.querySelector('.rw__figure').getBoundingClientRect();
    const dx = a.left - b.left;
    const dy = a.bottom - b.bottom;
    const sc = a.height / b.height;
    clone.style.transition = 'none';
    clone.style.transform = `translate3d(${dx}px, ${dy}px, 0) scale(${sc})`;
    void clone.offsetWidth;
    clone.style.transition = '';
    clone.style.transform = '';
    const close = this.lb.querySelector('[data-rw-zoom-close]');
    if (close) close.focus({ preventScroll: true });
  }

  closePopup() {
    if (!this.zoomed) return;
    const clone = this.lb.querySelector('.rw__lb-model');
    const hero = this.heros[this.index];
    const restore = () => {
      this.classList.remove('rw--zoom');
      this.lb.setAttribute('aria-hidden', 'true');
      this.zoomed = false;
      this.lbStage.innerHTML = '';
      if (this.contains(document.activeElement)) this.stage.focus({ preventScroll: true });
    };
    if (this.reduceMotion || !clone) { restore(); return; }
    const a = hero.querySelector('.rw__figure').getBoundingClientRect();
    const b = clone.querySelector('.rw__figure').getBoundingClientRect();
    const dx = a.left - b.left;
    const dy = a.bottom - b.bottom;
    const sc = a.height / b.height;
    clone.style.transform = `translate3d(${dx}px, ${dy}px, 0) scale(${sc})`;
    setTimeout(restore, 950);
  }

  /* ---------- pointer drag / swipe ---------- */
  bindPointer() {
    let pid = null, sx = 0, sy = 0, t0 = 0;
    const samples = [];
    const onDown = (e) => {
      if (e.button !== 0 && e.pointerType === 'mouse') return;
      if (this.zoomed) return;
      pid = e.pointerId;
      sx = e.clientX; sy = e.clientY; t0 = performance.now();
      samples.length = 0;
      samples.push({ x: e.clientX, time: t0 });
      this._dragT = this.target;
      this._dragStarted = false;
    };
    const onMove = (e) => {
      if (pid !== e.pointerId) return;
      const dx = e.clientX - sx, dy = e.clientY - sy;
      if (!this._dragStarted) {
        if (Math.abs(dx) > 8 && Math.abs(dx) > 1.2 * Math.abs(dy)) {
          this._dragStarted = true;
          this.dragging = true;
          this.classList.add('is-dragging');
          this.stage.classList.add('grabbing');
          try { this.stage.setPointerCapture(pid); } catch (err) {}
          this.setStill(false);
        } else if (Math.abs(dy) > 10) {
          pid = null;
        }
      }
      if (this._dragStarted) {
        this.target = this._dragT - dx / this.unit;
        this.cur = this.target;
        samples.push({ x: e.clientX, time: performance.now() });
        if (samples.length > 6) samples.shift();
        this.kick();
      }
    };
    const onUp = (e) => {
      if (pid !== e.pointerId) return;
      pid = null;
      if (!this._dragStarted) return;
      this.dragging = false;
      this.classList.remove('is-dragging');
      this.stage.classList.remove('grabbing');
      const first = samples[0], last = samples[samples.length - 1];
      const vx = (last.x - first.x) / (last.time - first.time);
      const sign = -1;
      const from = Math.round(this.target);
      if (this.isPhone) {
        const absDx = Math.abs(this._dragT - this.target) * this.unit;
        if (absDx > 30 || Math.abs(vx) > 0.3) {
          const dir = (this._dragT - this.target) > 0 ? 1 : -1;
          this.moveTo(from + dir);
        } else this.moveTo(from);
      } else {
        let i = Math.round(this.target + sign * vx * 160 / this.unit);
        if (i === from && Math.abs(vx) > 0.3) i += vx > 0 ? -1 : 1;
        i = Math.max(from - 2, Math.min(from + 2, i));
        this.moveTo(i);
      }
      setTimeout(() => { this._clickSuppress = Date.now(); }, 0);
    };
    this.stage.addEventListener('pointerdown', onDown);
    this.stage.addEventListener('pointermove', onMove);
    this.stage.addEventListener('pointerup', onUp);
    this.stage.addEventListener('pointercancel', onUp);
    // click suppression after drag
    this.stage.addEventListener('click', (e) => {
      if (this._clickSuppress && Date.now() - this._clickSuppress < 60) {
        e.stopPropagation(); e.preventDefault();
      }
    }, true);

    // trackpad horizontal wheel
    let acc = 0, locked = 0;
    this.stage.addEventListener('wheel', (e) => {
      if (Math.abs(e.deltaX) <= Math.abs(e.deltaY)) return;
      e.preventDefault();
      if (Date.now() < locked) return;
      acc += e.deltaX;
      if (Math.abs(acc) > 45) {
        if (acc > 0) this.next(); else this.prev();
        acc = 0;
        locked = Date.now() + 520;
      }
    }, { passive: false });

    // keyboard
    this.stage.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowRight') { e.preventDefault(); this.next(); }
      else if (e.key === 'ArrowLeft') { e.preventDefault(); this.prev(); }
    });
    document.addEventListener('keydown', (e) => {
      if (e.key !== 'Escape') return;
      if (this.sheetOpen) { this.dockSheet(); return; }
      if (this.zoomed) this.closePopup();
    });
  }

  /* ---------- custom cursor ---------- */
  bindCursor() {
    if (!this.cursor.parentNode) return;
    const loop = () => {
      const dx = this.ptr.tx - this.ptr.x;
      const dy = this.ptr.ty - this.ptr.y;
      const k = this.reduceMotion ? 1 : 0.18;
      this.ptr.x += dx * k;
      this.ptr.y += dy * k;
      this.cursor.style.transform = `translate3d(${this.ptr.x}px, ${this.ptr.y}px, 0)`;
      if (Math.abs(dx) > 0.2 || Math.abs(dy) > 0.2) requestAnimationFrame(loop);
    };
    this.stage.addEventListener('pointermove', (e) => {
      const r = this.stage.getBoundingClientRect();
      const x = e.clientX - r.left, y = e.clientY - r.top;
      if (!this.ptr.on) { this.ptr.x = x; this.ptr.y = y; this.ptr.on = true; this.cursor.classList.add('is-on'); }
      this.ptr.tx = x; this.ptr.ty = y;
      if (!this._cursorLoop) { this._cursorLoop = true; requestAnimationFrame(loop); }
    });
    this.stage.addEventListener('pointerleave', () => {
      this.ptr.on = false;
      this.cursor.classList.remove('is-on', 'is-link', 'is-view', 'is-drag');
    });
    this.stage.addEventListener('pointermove', () => {
      const hero = this.heros[this.index];
      const zoom = hero.querySelector('[data-rw-zoom]');
      const overZoom = zoom && zoom.matches(':hover') && !this.dragging;
      const overPin = this.stage.querySelector('.rw__pin:hover, .rw__hit:hover');
      this.cursor.classList.toggle('is-view', !!overZoom);
      this.cursor.classList.toggle('is-link', !!overPin);
      this.cursor.classList.toggle('is-drag', this.dragging);
    });
  }

  /* ---------- delegated clicks ---------- */
  bindClicks() {
    this.addEventListener('click', (e) => {
      const t = e.target;
      const pickClose = t.closest('[data-rw-pick-close]');
      if (pickClose) { e.preventDefault(); this.dockSheet(); return; }
      const lbClose = t.closest('[data-rw-zoom-close]');
      if (lbClose) { e.preventDefault(); this.closePopup(); return; }
      if (this.zoomed) {
        if (t.closest('[data-rw-lb-stage]') && !t.closest('.rw__lb-model')) { this.closePopup(); return; }
      }
      const zoom = t.closest('[data-rw-zoom]');
      if (zoom) { this.openPopup(); return; }
      const next = t.closest('[data-rw-next]');
      if (next) { this.engage(); this.next(); return; }
      const prev = t.closest('[data-rw-prev]');
      if (prev) { this.engage(); this.prev(); return; }
      const tick = t.closest('[data-rw-tick]');
      if (tick) { this.engage(); this.go(Number(tick.dataset.rwTick)); return; }
      const auto = t.closest('[data-rw-auto]');
      if (auto) {
        if (!this.playing) this.engaged = false;
        this.play(!this.playing);
        return;
      }
      const pin = t.closest('[data-rw-pin]');
      if (pin) { this.engage(); this.hot(Number(pin.dataset.rwPin), true); return; }
      const go = t.closest('[data-rw-go]');
      if (go) {
        const k = Number(go.dataset.rwGo) % N - this.index;
        const rank = ((k + 3) % 6) - 3;
        if (rank === 0) this.openPopup();
        else this.moveTo(Math.round(this.target) + k);
        return;
      }
      const confirm = t.closest('[data-rw-confirm]');
      if (confirm) {
        const card = confirm.closest('.rw__item');
        card.dataset.touched = '1';
        this.engage();
        this.addSingle(card);
        return;
      }
      const add = t.closest('[data-rw-add]');
      if (add) {
        const card = add.closest('.rw__item');
        this.engage();
        const picker = card.querySelector('[data-rw-picker]');
        if (card.classList.contains('is-added')) return;
        if (card.classList.contains('is-picking') || (this.sheetOpen && picker && picker.parentElement.classList.contains('rw-sheet-host'))) {
          if (this.isPhone) this.dockSheet();
          else this.closePicker(card);
        } else {
          this.openPicker(card);
        }
        return;
      }
      const all = t.closest('[data-rw-all]');
      if (all) { this.engage(); this.addFullLook(); return; }
    });

    // option change
    this.addEventListener('change', (e) => {
      const inp = e.target.closest('input[data-rw-option]');
      if (!inp) return;
      this.engage();
      const card = inp.closest('.rw__item');
      if (card) {
        card.dataset.touched = '1';
        this.updatePickerState(card);
      }
    });

    // panel hover pauses autoplay
    const panel = this.querySelector('.rw__panel');
    panel.addEventListener('pointerenter', () => { this.panelHover = true; this.restartAutoplay(); });
    panel.addEventListener('pointerleave', () => { this.panelHover = false; this.restartAutoplay(); });

    // engage on any interactive in panel
    panel.addEventListener('click', (e) => {
      if (e.target.closest('button, a, input, select, label')) this.engage();
    });

    // row hover hot
    const fine = matchMedia('(hover:hover)').matches;
    if (fine) {
      panel.addEventListener('pointerover', (e) => {
        const card = e.target.closest('.rw__item');
        if (card) this.hot(Number(card.dataset.rwCard), false);
      });
      panel.addEventListener('pointerout', (e) => {
        if (!e.target.closest('.rw__item')) this.clearHot();
      });
    }
  }

  /* ---------- bag dialog ---------- */
  bindBagDialog() {
    const dialog = document.getElementById('bag-dialog');
    const open = document.getElementById('open-bag');
    const close = document.getElementById('close-bag');
    const exportBtn = document.getElementById('export-bag');
    open.addEventListener('click', () => {
      this.renderBag();
      dialog.showModal();
    });
    close.addEventListener('click', () => dialog.close());
    dialog.addEventListener('click', (e) => {
      const rect = dialog.getBoundingClientRect();
      if (e.clientX < rect.left || e.clientX > rect.right || e.clientY < rect.top || e.clientY > rect.bottom) {
        dialog.close();
      }
    });
    exportBtn.addEventListener('click', () => {
      const lines = ['RUNWAY — STYLING SHORTLIST', 'Reference prices; no order or payment has been placed.', ''];
      for (const e of this.bag) {
        const item = CATALOG.items.find((i) => i.variants.some((v) => v.id === e.id));
        if (!item) continue;
        const v = item.variants.find((v) => v.id === e.id);
        lines.push(`${item.name} · Size ${v.o[0]} · Quantity ${e.quantity}`);
        lines.push(item.url);
        lines.push('');
      }
      const blob = new Blob([lines.join('\n')], { type: 'text/plain;charset=utf-8' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'runway-outfit-shortlist.txt';
      a.click();
      setTimeout(() => URL.revokeObjectURL(url), 1000);
    });
  }

  /* ---------- events + resize ---------- */
  bindEvents() {
    this.bindPointer();
    this.bindCursor();
    this.bindClicks();
    this.bindBagDialog();
    let rT = 0;
    window.addEventListener('resize', () => {
      clearTimeout(rT);
      rT = setTimeout(() => {
        this.measure();
        this.kick();
      }, 120);
    });
    new ResizeObserver(() => { this.measure(); this.kick(); }).observe(this.stage);
    document.addEventListener('visibilitychange', () => {
      if (document.hidden) this.stopLoop();
      else if (this.visible) this.kick();
    });
    document.addEventListener('visibilitychange', () => {
      if (!document.hidden) this.restartAutoplay();
    });
  }
}

/* ================= helpers ================= */
function wrapN(x) {
  const n = 12;
  return ((x % n) + n) % n;
}
function fmtUSD(v) {
  return new Intl.NumberFormat('en-US', { style: 'currency', currency: 'USD' }).format(v);
}
function loadBag() {
  try {
    const raw = JSON.parse(localStorage.getItem('runway-styling-bag-v3') || '[]');
    if (!Array.isArray(raw)) return [];
    return raw.filter((e) => e && Number.isInteger(e.id) && Number.isInteger(e.quantity) && e.quantity >= 1 && e.quantity <= 20).slice(0, 50);
  } catch (e) { return []; }
}
customElements.define('runway-section', RunwaySection);
})();
</script>
